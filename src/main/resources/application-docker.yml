spring:
  application:
    name: ink-ms-gateway

  codec:
    max-in-memory-size: 4MB

  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 180s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://inklusport.inklusport.uk"
              - "http://inklusport.inklusport.uk"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-ms
          uri: ${AUTH_SERVICE_URL:http://auth-service:3001}
          predicates:
            - Path=/api/auth/**

        - id: subscriptions-ms
          uri: ${SUBSCRIPTIONS_SERVICE_URL:http://subscriptions-service:3005}
          predicates:
            - Path=/api/plans/**,/api/subscriptions/**,/api/payments/**,/api/event-payments/**,/api/financial-reports/**,/api/admin/plans/**,/api/admin/subscriptions/**,/api/internal/subscriptions/**

        - id: users-ms
          uri: ${USERS_SERVICE_URL:http://users-service:3002}
          predicates:
            - Path=/api/users/**,/api/admin/**,/api/internal/**

        - id: sports-ms
          uri: ${SPORTS_SERVICE_URL:http://sports-service:3003}
          predicates:
            - Path=/api/sports/**,/api/events/**,/api/disabilities/**,/api/sport-disabilities/**,/api/registrations/**,/api/routines/**,/api/routine-registrations/**,/api/calendar/**,/api/scheduler/**,/api/attendance/**

        - id: reports-ms
          uri: ${REPORTS_SERVICE_URL:http://reports-service:3006}
          predicates:
            - Path=/api/analytics/**,/api/dashboard/**,/api/reports/**

        - id: accessibility-ms
          uri: ${ACCESSIBILITY_SERVICE_URL:http://accessibility-service:3004}
          predicates:
            - Path=/api/preferences/**,/api/notifications/**,/api/voice/**

        - id: ai-ms
          uri: ${AI_SERVICE_URL:http://ai-service:3008}
          predicates:
            - Path=/api/ai/**
          metadata:
            connect-timeout: 10000
            response-timeout: 180000

server:
  port: 8080

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  basic:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: INFO
