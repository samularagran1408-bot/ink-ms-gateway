spring:
  application:
    name: ink-ms-gateway
  
  cloud:
    gateway:
      routes:
        # 1. Auth Service
        - id: auth-ms
          uri: ${AUTH_SERVICE_URL:http://auth-service:3001}
          predicates:
            - Path=/api/auth/**

        # 2. Users Service (Path con comas = OR; líneas separadas = AND y rompe /api/admin)
        - id: users-ms
          uri: ${USERS_SERVICE_URL:http://users-service:3002}
          predicates:
            - Path=/api/users/**,/api/admin/**,/api/internal/**

        # 3. Sports Service
        - id: sports-ms
          uri: ${SPORTS_SERVICE_URL:http://sports-service:3003}
          predicates:
            - Path=/api/sports/**,/api/events/**,/api/disabilities/**,/api/sport-disabilities/**,/api/registrations/**,/api/calendar/**,/api/scheduler/**,/api/attendance/**

        # 4. Accessibility Service
        - id: accessibility-ms
          uri: ${ACCESSIBILITY_SERVICE_URL:http://accessibility-service:3004}
          predicates:
            - Path=/api/preferences/**,/api/notifications/**

        # 5. Reports Service
        - id: reports-ms
          uri: ${REPORTS_SERVICE_URL:http://reports-service:3006}
          predicates:
            - Path=/api/analytics/**,/api/dashboard/**,/api/reports/**

        # 6. AI Assistant Service (FastAPI)
        - id: ai-ms
          uri: ${AI_SERVICE_URL:http://ai-service:3008}
          predicates:
            - Path=/api/ai/**

server:
  port: 8080

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  basic:
    enabled: false

logging:
  level:
    org.springframework.cloud.gateway: INFO
